<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Terminus - Concourse Study</title>
<style>
  :root {
    --ink: #ece7dc;
    --ink-dim: #a9a294;
    --brass: #c9a35b;
    --chip: rgba(16, 18, 20, 0.62);
    --chip-line: rgba(236, 231, 220, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #14161a; }
  body { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  #stage { position: fixed; inset: 0; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse 120% 90% at 50% 42%, transparent 58%, rgba(8, 9, 11, 0.42) 100%);
  }
  .topline {
    position: fixed; inset: 0 0 auto 0; height: 30vh; pointer-events: none; z-index: 5;
    background: linear-gradient(rgba(10, 11, 13, 0.34), transparent);
  }
  header {
    position: fixed; top: 26px; left: 30px; z-index: 10; pointer-events: none;
    color: var(--ink); user-select: none;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; }
  header p {
    margin-top: 7px; font-size: 10.5px; letter-spacing: 0.14em; color: var(--ink-dim);
    text-transform: uppercase;
  }
  header .rule { width: 34px; height: 1px; background: var(--brass); margin-top: 12px; }
  nav {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 6px; padding: 6px;
    background: var(--chip); border: 1px solid var(--chip-line); border-radius: 4px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  nav button {
    appearance: none; border: 1px solid transparent; background: transparent;
    color: var(--ink-dim); font: inherit; font-size: 10.5px; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 8px 13px; cursor: pointer; border-radius: 3px;
    transition: color 0.25s, background 0.25s, border-color 0.25s;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  nav button .k { color: var(--brass); font-size: 9px; opacity: 0.75; }
  nav button:hover { color: var(--ink); background: rgba(236, 231, 220, 0.06); }
  nav button.active {
    color: var(--ink); background: rgba(201, 163, 91, 0.13);
    border-color: rgba(201, 163, 91, 0.4);
  }
  nav .sep { width: 1px; background: var(--chip-line); margin: 6px 3px; }
  #sndBtn.on { color: var(--brass); }
  .modes {
    position: fixed; top: 18px; right: 22px; z-index: 10;
    display: flex; border: 1px solid var(--chip-line); border-radius: 20px;
    background: rgba(16, 20, 24, 0.55); backdrop-filter: blur(8px);
    overflow: hidden;
  }
  .modes button {
    border: 0; border-right: 1px solid var(--chip-line); background: transparent;
    color: var(--mut); font: 500 10.5px/1 inherit; letter-spacing: 0.14em;
    padding: 9px 15px; cursor: pointer; transition: color 0.2s, background 0.2s;
  }
  .modes button:last-child { border-right: 0; }
  .modes button:hover { color: var(--ink); }
  .modes button.on { color: var(--brass); background: rgba(201, 163, 91, 0.14); }
  .meta {
    position: fixed; left: 30px; bottom: 30px; z-index: 10; pointer-events: none;
    color: var(--ink-dim); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    line-height: 1.9; user-select: none;
  }
  .meta b { color: var(--ink); font-weight: 500; }
  .hint {
    position: fixed; right: 30px; bottom: 30px; z-index: 10; pointer-events: none;
    color: var(--ink-dim); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    text-align: right; line-height: 1.9; user-select: none;
  }
  #fail {
    position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
    color: var(--ink); background: #14161a; font-size: 12px; letter-spacing: 0.1em;
  }
  #joy {
    position: fixed; left: 22px; bottom: 100px; z-index: 15;
    width: 118px; height: 118px; border-radius: 50%;
    border: 1px solid var(--chip-line); background: var(--chip);
    backdrop-filter: blur(10px); display: none; touch-action: none;
  }
  #joyKnob {
    position: absolute; left: 39px; top: 39px; width: 40px; height: 40px;
    border-radius: 50%; background: rgba(236, 231, 220, 0.45);
    pointer-events: none;
  }
  #runBtn {
    position: fixed; right: 22px; bottom: 100px; z-index: 15;
    width: 64px; height: 64px; border-radius: 50%; display: none;
    border: 1px solid var(--chip-line); background: var(--chip);
    color: var(--ink-dim); font: inherit; font-size: 10px; letter-spacing: 0.15em;
    align-items: center; justify-content: center; touch-action: none;
    user-select: none; -webkit-user-select: none; text-transform: uppercase;
  }
  #runBtn.on { color: var(--brass); border-color: rgba(201, 163, 91, 0.5); }
  @media (max-width: 900px) {
    nav { max-width: calc(100vw - 24px); overflow-x: auto; bottom: 14px; }
    .meta, .hint { display: none; }
    header { left: 20px; top: 18px; }
    #joy { bottom: 86px; }
    #runBtn { bottom: 86px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="topline"></div>
<div class="vignette"></div>
<header>
  <h1>Meridian Terminus</h1>
  <p>Grand concourse study / arch span 64 m / rise 30 m</p>
  <div class="rule"></div>
</header>
<nav id="views"></nav>
<div class="meta">
  <b>19 lattice ribs</b> on 10 m bays<br>
  Buff brick / blue steel / crown glass
</div>
<div class="modes">
  <button id="mb-orbit" class="on">Orbit</button>
  <button id="mb-fp">1P</button>
  <button id="mb-tp">3P</button>
</div>
<div id="joy"><div id="joyKnob"></div></div>
<button id="runBtn">Run</button>
<div class="hint">Drag to orbit / scroll to zoom<br>Keys 1-6 views / M ambience</div>
<div id="fail"><p>WebGL unavailable in this browser.</p></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';
import { Reflector } from './vendor/Reflector.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { clone as skClone } from './vendor/SkeletonUtils.js';
import { EffectComposer } from './vendor/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './vendor/postprocessing/OutputPass.js';

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
} catch (e) {
  document.getElementById('fail').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8b6bd);
scene.fog = new THREE.Fog(0xa8b6bd, 150, 1100);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 800;
controls.minDistance = 1.2;
controls.maxPolarAngle = 1.545;

const HALF = 30.5, SPRING = 12, APEX = 30, LEN = 180, BAY = 10;
const CY = (HALF * HALF + SPRING * SPRING - APEX * APEX) / (2 * (SPRING - APEX));
const R = APEX - CY;
const AMAX = Math.asin(HALF / R);
const archY = x => CY + Math.sqrt(Math.max(R * R - x * x, 0));

const steel = new THREE.MeshStandardMaterial({ color: 0x50687d, metalness: 0.62, roughness: 0.42 });
const steelDark = new THREE.MeshStandardMaterial({ color: 0x323c44, metalness: 0.6, roughness: 0.5 });
const iron = new THREE.MeshStandardMaterial({ color: 0x252a2e, metalness: 0.55, roughness: 0.55 });
const cream = new THREE.MeshStandardMaterial({ color: 0xd8cfb6, roughness: 0.75 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x98918a, metalness: 0.3, roughness: 0.7, side: THREE.DoubleSide });
const glassMat = new THREE.MeshStandardMaterial({ color: 0xc4d8e0, transparent: true, opacity: 0.2, roughness: 0.12, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
const glassDark = new THREE.MeshStandardMaterial({ color: 0x3d4f58, transparent: true, opacity: 0.42, roughness: 0.15, metalness: 0.2, side: THREE.DoubleSide, depthWrite: false });
const timber = new THREE.MeshStandardMaterial({ color: 0x74563a, roughness: 0.8 });
const brass = new THREE.MeshStandardMaterial({ color: 0xa8843f, metalness: 0.75, roughness: 0.35 });
const concrete = new THREE.MeshStandardMaterial({ color: 0x8a867d, roughness: 0.92 });
const darkSlab = new THREE.MeshStandardMaterial({ color: 0x4c4a46, roughness: 0.95 });
const railMat = new THREE.MeshStandardMaterial({ color: 0x9aa2a8, metalness: 0.9, roughness: 0.28 });
const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffd9a0, emissive: 0xffc478, emissiveIntensity: 2.2 });
const tactile = new THREE.MeshStandardMaterial({ color: 0xb39b4e, roughness: 0.9 });

function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = 8;
  return t;
}

const brickTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#a3937c'; g.fillRect(0, 0, w, h);
  const bh = 16, bw = 58;
  for (let y = 0, row = 0; y < h; y += bh, row++) {
    for (let x = -bw; x < w + bw; x += bw) {
      const ox = (row % 2) * bw * 0.5;
      const v = Math.sin(x * 12.9 + y * 7.7) * 0.5 + 0.5;
      const r = 150 + v * 42 + Math.random() * 12;
      const gr = 118 + v * 32 + Math.random() * 10;
      const b = 82 + v * 22 + Math.random() * 8;
      g.fillStyle = Math.random() < 0.06 ? '#6e5844' : `rgb(${r | 0},${gr | 0},${b | 0})`;
      g.fillRect(x + ox + 1.5, y + 1.5, bw - 3, bh - 3);
    }
  }
}, 0.25, 0.25);

const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#8e8a81'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const v = 118 + Math.random() * 60;
    g.fillStyle = `rgba(${v},${v - 4},${v - 12},0.5)`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.4, 1.4);
  }
  g.strokeStyle = 'rgba(88,84,78,0.85)'; g.lineWidth = 2.4;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke();
    g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke();
  }
});
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.5, metalness: 0.08 });
const brickMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.9 });

function tube(a, b, r, seg = 7) {
  const d = a.distanceTo(b);
  const g = new THREE.CylinderGeometry(r, r, d, seg, 1);
  g.translate(0, d / 2, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), b.clone().sub(a).normalize());
  g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(q).setPosition(a.x, a.y, a.z));
  return g;
}
function box(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (rx || ry || rz) g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz)));
  g.translate(x, y, z);
  return g;
}
function slabTop(w, l, x, z) {
  const g = new THREE.PlaneGeometry(w, l);
  g.rotateX(-Math.PI / 2);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 4, uv.getY(i) * l / 4);
  g.translate(x, 1.056, z);
  return g;
}
function mesh(geos, mat, cast = false, recv = true) {
  const m = new THREE.Mesh(Array.isArray(geos) ? mergeGeometries(geos.map(g => g.index ? g.toNonIndexed() : g), false) : geos, mat);
  m.castShadow = cast; m.receiveShadow = recv;
  scene.add(m);
  return m;
}

const steelGeos = [], darkGeos = [], creamGeos = [], brassGeos = [];

function ribAt(z) {
  const N = 26;
  for (const zo of [-0.55, 0.55]) {
    let pB = null, pT = null;
    for (let i = 0; i <= N; i++) {
      const a = -AMAX + 2 * AMAX * i / N;
      const B = V3(R * Math.sin(a), CY + R * Math.cos(a), z + zo);
      const T = V3((R - 1.8) * Math.sin(a), CY + (R - 1.8) * Math.cos(a), z + zo);
      steelGeos.push(tube(B, T, 0.1, 6));
      if (pB) {
        steelGeos.push(tube(pB, B, 0.17, 8), tube(pT, T, 0.17, 8));
        steelGeos.push(tube(pT, B, 0.065, 5), tube(pB, T, 0.065, 5));
        steelGeos.push(tube(V3(pB.x, pB.y, z - 0.55), V3(pB.x, pB.y, z + 0.55), 0.07, 5));
      }
      pB = B; pT = T;
    }
    steelGeos.push(tube(V3(pB.x, pB.y, z - 0.55), V3(pB.x, pB.y, z + 0.55), 0.07, 5));
  }
  steelGeos.push(box(2.6, 1.1, 1.5, -HALF + 0.4, SPRING - 0.2, z));
  steelGeos.push(box(2.6, 1.1, 1.5, HALF - 0.4, SPRING - 0.2, z));
  creamGeos.push(box(2.0, 0.9, 1.9, -HALF - 0.6, SPRING - 0.9, z));
  creamGeos.push(box(2.0, 0.9, 1.9, HALF + 0.6, SPRING - 0.9, z));
}
for (let z = -90; z <= 90; z += BAY) ribAt(z);

const NB = 13, DAB = 2 * AMAX / NB, GLAZED = new Set([2, 4, 8, 10]);
for (let i = 0; i <= NB; i++) {
  const a = -AMAX + DAB * i;
  steelGeos.push(box(0.26, 0.3, LEN + 1.4, (R - 0.6) * Math.sin(a), CY + (R - 0.6) * Math.cos(a), 0));
}
const RS = R + 0.32;
const solidRoof = [], glassRoof = [];
for (let i = 0; i < NB; i++) {
  const g = new THREE.CylinderGeometry(RS, RS, LEN + 2, 10, 1, true, -AMAX + DAB * i, DAB);
  g.rotateX(-Math.PI / 2);
  g.translate(0, CY, 0);
  (GLAZED.has(i) ? glassRoof : solidRoof).push(g);
}
mesh(solidRoof, roofMat, true);
mesh(glassRoof, glassMat);
steelGeos.push(box(1.4, 0.9, LEN + 2, 0, APEX + 0.55, 0));
steelGeos.push(box(1.1, 0.5, LEN + 2, -HALF - 0.15, SPRING + 0.55, 0));
steelGeos.push(box(1.1, 0.5, LEN + 2, HALF + 0.15, SPRING + 0.55, 0));

function sideWall() {
  const s = new THREE.Shape();
  s.moveTo(-90, 0); s.lineTo(90, 0); s.lineTo(90, 12); s.lineTo(-90, 12); s.closePath();
  for (let i = 0; i < 18; i++) {
    const cz = -85 + i * 10;
    const p = new THREE.Path();
    p.moveTo(cz - 2.2, 2.2); p.lineTo(cz - 2.2, 8.0);
    p.absarc(cz, 8.0, 2.2, Math.PI, 0, true);
    p.lineTo(cz + 2.2, 2.2); p.closePath();
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: 1.0, bevelEnabled: false });
  g.rotateY(-Math.PI / 2);
  return g;
}
const wallL = new THREE.Mesh(sideWall(), brickMat);
wallL.geometry.translate(-31, 0, 0);
wallL.castShadow = wallL.receiveShadow = true;
scene.add(wallL);
const wallR = new THREE.Mesh(sideWall(), brickMat);
wallR.geometry.translate(32, 0, 0);
wallR.castShadow = wallR.receiveShadow = true;
scene.add(wallR);

const paneGeos = [];
for (const sx of [-31.05, 31.05]) {
  for (let i = 0; i < 18; i++) {
    const cz = -85 + i * 10;
    const s = new THREE.Shape();
    s.moveTo(cz - 2.2, 2.2); s.lineTo(cz - 2.2, 8.0);
    s.absarc(cz, 8.0, 2.2, Math.PI, 0, true);
    s.lineTo(cz + 2.2, 2.2); s.closePath();
    const g = new THREE.ShapeGeometry(s, 12);
    g.rotateY(-Math.PI / 2);
    g.translate(sx + 0.42 * Math.sign(sx), 0, 0);
    paneGeos.push(g);
  }
}
mesh(paneGeos, glassDark);

for (const sx of [-30.82, 30.82]) {
  for (let z = -80; z <= 80; z += 10) creamGeos.push(box(0.34, 12, 1.15, sx, 6, z));
  creamGeos.push(box(0.55, 0.6, LEN, sx - Math.sign(sx) * 0.05, 12.35, 0));
}

function archOutline() {
  const s = new THREE.Shape();
  s.moveTo(-31, 0); s.lineTo(-31, SPRING);
  for (let i = 0; i <= 44; i++) {
    const a = -AMAX + 2 * AMAX * i / 44;
    s.lineTo(R * Math.sin(a), CY + R * Math.cos(a));
  }
  s.lineTo(31, SPRING); s.lineTo(31, 0); s.closePath();
  return s;
}
function archHole(cx, base, w, spring) {
  const p = new THREE.Path();
  const r = w / 2;
  p.moveTo(cx - r, base); p.lineTo(cx - r, spring);
  p.absarc(cx, spring, r, Math.PI, 0, true);
  p.lineTo(cx + r, base); p.closePath();
  return p;
}
function archPaneGeo(cx, base, w, spring, z) {
  const s = new THREE.Shape();
  const r = w / 2;
  s.moveTo(cx - r, base); s.lineTo(cx - r, spring);
  s.absarc(cx, spring, r, Math.PI, 0, true);
  s.lineTo(cx + r, base); s.closePath();
  const g = new THREE.ShapeGeometry(s, 14);
  g.translate(0, 0, z);
  return g;
}

const farShape = archOutline();
for (const tx of [-21, -9, 9, 21]) farShape.holes.push(archHole(tx, 0, 5.6, 6.0));
farShape.holes.push(archHole(0, 14, 9.0, 18.6));
const fo1 = new THREE.Path(); fo1.absarc(-17, 20.5, 1.9, 0, Math.PI * 2, true); farShape.holes.push(fo1);
const fo2 = new THREE.Path(); fo2.absarc(17, 20.5, 1.9, 0, Math.PI * 2, true); farShape.holes.push(fo2);
const farG = new THREE.ExtrudeGeometry(farShape, { depth: 1.0, bevelEnabled: false });
farG.translate(0, 0, -91);
const farWall = new THREE.Mesh(farG, brickMat);
farWall.castShadow = farWall.receiveShadow = true;
scene.add(farWall);

const farGlass = [archPaneGeo(0, 14, 9.0, 18.6, -90.45)];
for (const o of [[-17, 20.5, 1.9], [17, 20.5, 1.9]]) {
  const c = new THREE.Shape(); c.absarc(o[0], o[1], o[2], 0, Math.PI * 2, false);
  const g = new THREE.ShapeGeometry(c, 20); g.translate(0, 0, -90.45); farGlass.push(g);
}
mesh(farGlass, glassDark);
steelGeos.push(box(9.4, 0.28, 0.3, 0, 18.6, -90.4));
for (const mx of [-3, 0, 3]) steelGeos.push(box(0.24, 9.0, 0.3, mx, 19.2, -90.4));
for (const o of [-17, 17]) {
  steelGeos.push(box(4.0, 0.22, 0.3, o, 20.5, -90.4));
  steelGeos.push(box(0.22, 4.0, 0.3, o, 20.5, -90.4));
}

const nearShape = archOutline();
for (const dx of [-11, 0, 11]) nearShape.holes.push(archHole(dx, 1.0, 4.4, 4.6));
nearShape.holes.push(archHole(0, 13, 18, 21));
const nearG = new THREE.ExtrudeGeometry(nearShape, { depth: 1.0, bevelEnabled: false });
nearG.translate(0, 0, 90);
const nearWall = new THREE.Mesh(nearG, brickMat);
nearWall.castShadow = nearWall.receiveShadow = true;
scene.add(nearWall);
mesh([archPaneGeo(0, 13, 18, 21, 90.55)], glassDark);
for (let i = -2; i <= 2; i++) steelGeos.push(box(0.26, 15.6, 0.34, i * 3.6, 19.9, 90.55));
steelGeos.push(box(18.4, 0.3, 0.34, 0, 21, 90.55));

const nameTex = canvasTex(1024, 96, (g, w, h) => {
  g.fillStyle = '#1d2b36'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e8dfc8';
  g.font = '600 46px Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('M E R I D I A N   T E R M I N U S', w / 2, h / 2 + 2);
});
const nameBoard = new THREE.Mesh(new THREE.BoxGeometry(17, 1.6, 0.28), new THREE.MeshStandardMaterial({ map: nameTex, roughness: 0.6 }));
nameBoard.position.set(0, 11.3, 89.6);
scene.add(nameBoard);

const plats = [[-31, -22.7], [-19.3, -10.7], [-7.3, 7.3], [10.7, 19.3], [22.7, 31]];
const glossMat = new THREE.MeshStandardMaterial({ map: floorTex, transparent: true, opacity: 0.68, roughness: 0.3, metalness: 0.05 });
function glossyFloor(w, l, x, z) {
  const rg = new THREE.PlaneGeometry(w, l);
  rg.rotateX(-Math.PI / 2);

    pA.x, pA.y, pA.z, pB.x, pB.y, pB.z, pC.x, pC.y, pC.z,
    pA.x, pA.y, pA.z, pC.x, pC.y, pC.z, pD.x, pD.y, pD.z,
  ], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 1, 1, 0, 0, 0], 2));
  return g;
}
for (const i of GLAZED) {
  const a = -AMAX + DAB * (i + 0.5);
  const tg = V3(Math.cos(a), -Math.sin(a), 0);
  for (const s of [-1, 1]) {
    const base = V3(RS * Math.sin(a), CY + RS * Math.cos(a), 0).add(tg.clone().multiplyScalar(2.6 * s));
    const len = (base.y - 1.2) / -sunDir.y * 0.62;
    const dvec = sunDir.clone().multiplyScalar(len);
    const pA = base.clone().setZ(-82), pB = base.clone().setZ(78);
    scene.add(new THREE.Mesh(quadGeo(pA, pB, pB.clone().add(dvec), pA.clone().add(dvec)), shaftMat));
  }
}
for (const wz of [-58, -28, 4, 34]) {
  const top = V3(30.9, 8.4, wz);
  const len = (8.4 - 1.05) / -sunDir.y;
  const dvec = sunDir.clone().multiplyScalar(len);
  for (const tilt of [0, 0.85]) {
    const ad = V3(0, 0, 2.1).applyAxisAngle(sunDir, tilt);
    scene.add(new THREE.Mesh(quadGeo(
      top.clone().sub(ad), top.clone().add(ad),
      top.clone().add(ad).add(dvec), top.clone().sub(ad).add(dvec)), shaftMatW));
  }
}

const cubeRT = new THREE.WebGLCubeRenderTarget(256);
const cubeCam = new THREE.CubeCamera(0.5, 400, cubeRT);
cubeCam.position.set(0, 9, 10);
cubeCam.update(renderer, scene);
const pmrem = new THREE.PMREMGenerator(renderer);

scene.traverse(o => { if (o.material && o.material.isMeshStandardMaterial) o.material.envMapIntensity = 0.4; });
for (const [m, v] of [[steel, 0.55], [steelDark, 0.4], [iron, 0.4], [roofMat, 0.3], [brass, 0.9], [railMat, 1.0], [concrete, 0.15], [darkSlab, 0.1], [floorMat, 0.55], [glossMat, 0.45], [bulbMat, 0.2]]) m.envMapIntensity = v;

let AC = null, masterG, trainG, squealG, reverbNode, noiseShared = null, soundOn = false;
function noiseBuf(sec) {
  const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate);
  const d = b.getChannelData(0);
  let v = 0;
  for (let i = 0; i < d.length; i++) { v = (v + (Math.random() * 2 - 1) * 0.04) * 0.985; d[i] = v * 6; }
  return b;
}
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor();
  masterG = AC.createGain(); masterG.gain.value = 0;
  masterG.connect(comp); comp.connect(AC.destination);
  const irLen = (AC.sampleRate * 2.2) | 0;
  const ir = AC.createBuffer(2, irLen, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.6);
  }
  reverbNode = AC.createConvolver(); reverbNode.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = 0.42;
  reverbNode.connect(wet); wet.connect(masterG);
  const nb = noiseBuf(4);
  noiseShared = nb;
  const src = (rate, filt, freq, q, gain) => {
    const s = AC.createBufferSource(); s.buffer = nb; s.loop = true; s.playbackRate.value = rate;
    const f = AC.createBiquadFilter(); f.type = filt; f.frequency.value = freq; if (q) f.Q.value = q;
    const g = AC.createGain(); g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(masterG); g.connect(reverbNode);
    s.start();
    return g;
  };
  src(1.0, 'lowpass', 300, 0, 0.5);
  const babG = src(1.7, 'bandpass', 680, 0.6, 0.1);
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.13;
  const lfoG = AC.createGain(); lfoG.gain.value = 0.05;
  lfo.connect(lfoG); lfoG.connect(babG.gain); lfo.start();
  trainG = src(0.55, 'lowpass', 130, 0, 0);
  squealG = src(2.6, 'bandpass', 2900, 14, 0);
  setTimeout(chime, 9000);
}
function chime() {
  if (AC && soundOn) {
    [660, 550, 440].forEach((f, i) => {
      const o = AC.createOscillator(); o.frequency.value = f;
      const g = AC.createGain(); g.gain.value = 0;
      o.connect(g); g.connect(masterG); g.connect(reverbNode);
      const t0 = AC.currentTime + i * 0.55;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.13, t0 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0006, t0 + 1.8);
      o.start(t0); o.stop(t0 + 1.9);
    });
  }
  if (AC) setTimeout(chime, 24000 + Math.random() * 20000);
}
function toggleSound() {
  if (!AC) initAudio();
  soundOn = !soundOn;
  if (soundOn) AC.resume();
  masterG.gain.setTargetAtTime(soundOn ? 0.5 : 0, AC.currentTime, 0.4);
  document.getElementById('sndBtn').classList.toggle('on', soundOn);
}

const roofGroup = new THREE.Group();
scene.add(roofGroup);
for (const m of scene.children.filter(o => o.material === roofMat || o.material === glassMat)) roofGroup.attach(m);

const VIEWS = [
  { n: 'Nave', p: [0, 4.4, 80], t: [0, 9.5, -45] },
  { n: 'Platform', p: [-14.6, 2.7, 32], t: [-8.6, 3.6, -68] },
  { n: 'Arcade', p: [24.6, 2.5, 58], t: [30.5, 9.5, -68] },
  { n: 'The Vault', p: [10.5, 1.9, 34], t: [-8, 26, -40] },
  { n: 'Buffers', p: [-6.5, 2.3, 72], t: [3.5, 4.2, 36] },
  { n: 'Section', p: [58, 44, 4], t: [0, 7, -6], roof: true },
  { n: 'Forecourt', p: [-34, 5.5, 168], t: [0, 13, 96], k: '0' },
  { n: 'City', p: [-270, 170, 430], t: [0, 8, 60], k: '9' },
];
const hintEl = document.querySelector('.hint');
function setMode(m) {
  if (mode === m) return;
  mode = m;
  tween = null;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  if (m === 'orbit') {
    document.exitPointerLock();
    if (avatar) avatar.g.visible = false;
    controls.enabled = true;
    controls.target.set(player.pos.x - Math.sin(player.yaw) * 8, player.pos.y + 1.6, player.pos.z - Math.cos(player.yaw) * 8);
    controls.update();
    hintEl.innerHTML = 'Drag to orbit / scroll to zoom<br>Keys 1-6 views / M ambience';
  } else {
    controls.enabled = false;
    if (avatar) avatar.g.visible = (m === 'tp');
    try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
    hintEl.innerHTML = 'WASD walk / Shift run / click to look<br>Esc frees cursor / 1-6 back to views';
    walkBtns[m === 'fp' ? 0 : 1].classList.add('active');
  }
  document.getElementById('mb-orbit').classList.toggle('on', m === 'orbit');
  document.getElementById('mb-fp').classList.toggle('on', m === 'fp');
  document.getElementById('mb-tp').classList.toggle('on', m === 'tp');
  const showTouch = isTouch && m !== 'orbit';
  joyEl.style.display = showTouch ? 'block' : 'none';
  runEl.style.display = showTouch ? 'flex' : 'none';
}
document.getElementById('mb-orbit').onclick = () => setMode('orbit');
document.getElementById('mb-fp').onclick = () => setMode('fp');
document.getElementById('mb-tp').onclick = () => setMode('tp');
let tween = null;
function flyTo(v) {
  if (mode !== 'orbit') setMode('orbit');
  tween = {
    t: 0,
    p0: camera.position.clone(), p1: V3(...v.p),
    t0: controls.target.clone(), t1: V3(...v.t),
  };
  controls.enabled = false;
  document.querySelectorAll('nav button').forEach((b, i) => b.classList.toggle('active', VIEWS[i] === v));
  roofGroup.visible = !v.roof;
}

const navEl = document.getElementById('views');
VIEWS.forEach((v, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="k">${v.k ?? i + 1}</span>${v.n}`;
  b.onclick = () => flyTo(v);
  navEl.appendChild(b);
});
const walkBtns = [];
[['7', 'Walk 1P', 'fp'], ['8', 'Walk 3P', 'tp']].forEach(([k, n, m]) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="k">${k}</span>${n}`;

});
const sep = document.createElement('span');
sep.className = 'sep';
navEl.appendChild(sep);
const sndBtn = document.createElement('button');
sndBtn.id = 'sndBtn';
sndBtn.innerHTML = '<span class="k">M</span>Ambience';
sndBtn.onclick = toggleSound;
navEl.appendChild(sndBtn);
addEventListener('keydown', e => {
  keysDown.add(e.code);
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.code === 'Digit7') setMode('fp');
  if (e.code === 'Digit8') setMode('tp');
  const i = +e.key - 1;
  if (e.key === '0' && VIEWS[6]) flyTo(VIEWS[6]);
  else if (e.key === '9' && VIEWS[7]) flyTo(VIEWS[7]);
  else if (VIEWS[i]) flyTo(VIEWS[i]);
});
addEventListener('keyup', e => keysDown.delete(e.code));
addEventListener('mousemove', e => {
  if (mode !== 'orbit' && document.pointerLockElement === renderer.domElement) {
    player.yaw -= e.movementX * 0.0022;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - e.movementY * 0.0022));
  }
});
renderer.domElement.addEventListener('click', () => {
  if (mode !== 'orbit' && document.pointerLockElement !== renderer.domElement) {
    try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  }
});
const isTouch = matchMedia('(pointer: coarse)').matches;
const joyEl = document.getElementById('joy'), knobEl = document.getElementById('joyKnob'), runEl = document.getElementById('runBtn');
const joyVec = { x: 0, y: 0 };
let joyId = null, jx0 = 0, jy0 = 0, sprintTouch = false;
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; jx0 = e.clientX; jy0 = e.clientY; joyEl.setPointerCapture(joyId); });
joyEl.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - jx0, dy = e.clientY - jy0, l = Math.hypot(dx, dy), m = Math.min(l, 40);
  joyVec.x = l ? dx / l * m / 40 : 0;
  joyVec.y = l ? dy / l * m / 40 : 0;
  knobEl.style.transform = `translate(${l ? dx / l * m : 0}px,${l ? dy / l * m : 0}px)`;
});
const joyEnd = e => { if (e.pointerId === joyId) { joyId = null; joyVec.x = joyVec.y = 0; knobEl.style.transform = ''; } };
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);
runEl.addEventListener('pointerdown', () => { sprintTouch = true; runEl.classList.add('on'); });
const runEnd = () => { sprintTouch = false; runEl.classList.remove('on'); };
runEl.addEventListener('pointerup', runEnd);
runEl.addEventListener('pointercancel', runEnd);
let lookId = null, lookX = 0, lookY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' || mode === 'orbit') return;
  lookId = e.pointerId;
  lookX = e.clientX;
  lookY = e.clientY;
});
addEventListener('pointermove', e => {
  if (e.pointerId !== lookId) return;
  player.yaw -= (e.clientX - lookX) * 0.0045;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - (e.clientY - lookY) * 0.0045));
  lookX = e.clientX;
  lookY = e.clientY;
});
const lookEnd = e => { if (e.pointerId === lookId) lookId = null; };
addEventListener('pointerup', lookEnd);
addEventListener('pointercancel', lookEnd);
controls.addEventListener('start', () => {
  if (!tween) document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
});

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let prevOff = 0, prevParkedA = false, prevParkedB = false;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clock = new THREE.Clock();
const qs = new URLSearchParams(location.search);
const startView = Math.min(Math.max((+qs.get('v') || 1) - 1, 0), VIEWS.length - 1);
camera.position.set(...VIEWS[startView].p);
controls.target.set(...VIEWS[startView].t);
roofGroup.visible = !VIEWS[startView].roof;
document.querySelectorAll('nav button')[startView].classList.add('active');
const startMode = qs.get('m');
if (startMode === 'fp' || startMode === 'tp') setMode(startMode);

const TRAIN_CYCLE = 70;
function trainOffset(t) {
  if (t < 8) return 0;
  if (t < 30) { const k = (t - 8) / 22; return -190 * k * k; }
  if (t < 38) return -190;
  if (t < 62) { const k = (t - 38) / 24; return -190 * Math.pow(1 - k, 3); }
  return 0;
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const et = clock.elapsedTime;

  const off = trainOffset(et % TRAIN_CYCLE);
  if (trainA) trainA.position.z = off;
  if (trainB) trainB.position.z = trainOffset((et + 35) % TRAIN_CYCLE);
  const trainSpeed = Math.abs(off - prevOff) / Math.max(dt, 0.001);
  prevOff = off;
  if (soundOn && AC) {
    const ta = et % TRAIN_CYCLE;
    trainG.gain.setTargetAtTime(Math.min(trainSpeed / 20, 1) * 0.55, AC.currentTime, 0.3);
    const sqEnv = (ta > 54 && ta < 62) ? Math.sin((ta - 54) / 8 * Math.PI) * 0.11 : 0;
    squealG.gain.setTargetAtTime(sqEnv, AC.currentTime, 0.2);
  }

  const tA = et % TRAIN_CYCLE, tB = (et + 35) % TRAIN_CYCLE;
  const parkedA = tA >= 62 || tA < 8, parkedB = tB >= 62 || tB < 8;
  if (parkedA && !prevParkedA && trainA) dispatchBoarding(trainA, -9, 26, 5);
  if (parkedB && !prevParkedB && trainB) dispatchBoarding(trainB, 21, 20, 4);
  prevParkedA = parkedA; prevParkedB = parkedB;

  for (const w of animWalk) {
    const cyc = (et * w.sp + w.off) / w.len;
    const tri = 1 - Math.abs((cyc % 2) - 1);
    const dir = (cyc % 2) < 1 ? 1 : -1;
    const step = et * 6.2 + w.off * 5;
    const sw = Math.sin(step);
    w.g.position.x = w.x0 + (w.x1 - w.x0) * tri;
    w.g.position.z = w.z0 + (w.z1 - w.z0) * tri;
    w.g.position.y = (w.fy ?? 1.05) + (w.mixer ? 0 : Math.abs(Math.cos(step)) * 0.032);
    w.g.rotation.y = Math.atan2((w.x1 - w.x0) * dir, (w.z1 - w.z0) * dir);
    if (!w.mixer) {
      w.legL.rotation.x = sw * 0.52;
      w.legR.rotation.x = -sw * 0.52;
      w.armL.rotation.x = -sw * 0.42;
      w.armR.rotation.x = sw * 0.42;
      if (w.shinL) {
        w.shinL.rotation.x = Math.max(0, -sw) * 0.75;
        w.shinR.rotation.x = Math.max(0, sw) * 0.75;
        w.armFL.rotation.x = -0.28 + Math.max(0, -sw) * 0.3;
        w.armFR.rotation.x = -0.28 + Math.max(0, sw) * 0.3;
      }
      w.torso.rotation.x = 0.045;
      w.head.rotation.x = Math.sin(et * 3 + w.off) * 0.04;
    }
  }
  for (const c of animChat) {
    if (c.head) {
      c.head.rotation.x = Math.sin(et * 2.3 + c.ph) * 0.12;
      c.head.rotation.y = Math.sin(et * 0.8 + c.ph) * 0.18;
    }
    if (c.torso) c.torso.rotation.x = 0.02 + Math.sin(et * 1.1 + c.ph) * 0.03;
    if (c.spk && c.armR) {
      c.armR.rotation.x = -0.55 + Math.sin(et * 2.6 + c.ph) * 0.2;
      if (c.armFR) c.armFR.rotation.x = -0.75 + Math.sin(et * 2.6 + c.ph) * 0.18;
    } else if (c.armFL) { c.armFL.rotation.x = -0.2; c.armFR.rotation.x = -0.2; }
  }
  for (const s of animIdle) {
    if (s.head) {
      s.head.rotation.x = Math.sin(et * 0.9 + s.ph) * 0.07;
      s.head.rotation.y = Math.sin(et * 0.5 + s.ph) * 0.12;
    }
    if (s.armL) { s.armL.rotation.x = 0.06; s.armR.rotation.x = 0.06; }
    if (s.armFL) { s.armFL.rotation.x = -0.15; s.armFR.rotation.x = -0.15; }
  }
  for (let i = animBoard.length - 1; i >= 0; i--) {
    const b = animBoard[i];
    const dx = b.tgt.x - b.g.position.x, dz = b.tgt.z - b.g.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.4) {
      if (b.out) {
        const x0 = b.tgt.x - 7, z0 = b.tgt.z, x1 = b.tgt.x + 7, z1 = b.tgt.z + 6;
        animWalk.push({ ...b, x0, z0, x1, z1, off: rnd() * 20, len: Math.hypot(x1 - x0, z1 - z0) });
      } else scene.remove(b.g);
      animBoard.splice(i, 1);
      continue;
    }
    const step = et * 6.2 + b.ph * 5;
    const sw = Math.sin(step);
    b.g.position.x += dx / d * b.sp * dt;
    b.g.position.z += dz / d * b.sp * dt;
    b.g.position.y = 1.05 + (b.mixer ? 0 : Math.abs(Math.cos(step)) * 0.03);
    const ty = Math.atan2(dx, dz);
    let da = ty - b.g.rotation.y;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    b.g.rotation.y += da * Math.min(1, dt * 8);
    if (!b.mixer) {
      b.legL.rotation.x = sw * 0.52;
      b.legR.rotation.x = -sw * 0.52;
      if (b.shinL) { b.shinL.rotation.x = Math.max(0, -sw) * 0.75; b.shinR.rotation.x = Math.max(0, sw) * 0.75; }
      b.armL.rotation.x = -sw * 0.42;
      b.armR.rotation.x = sw * 0.42;
      if (b.armFL) { b.armFL.rotation.x = -0.28; b.armFR.rotation.x = -0.28; }
    }
  }
  for (const m of mixers) m.update(dt);
  for (const c of traffic) {
    const p = c.g.position;
    p[c.axis] += c.sp * dt;
    if (c.sp > 0 && p[c.axis] > c.max) p[c.axis] = c.min;
    if (c.sp < 0 && p[c.axis] < c.min) p[c.axis] = c.max;
  }
  dust.position.y = Math.sin(et * 0.06) * 1.6;
  dust.position.x = Math.sin(et * 0.045) * 2.5;
  dust.rotation.y = et * 0.0022;

  if (tween) {
    tween.t += dt / 1.6;
    const k = ease(Math.min(tween.t, 1));
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= 1) { tween = null; controls.enabled = true; }
  }
  if (mode === 'orbit') controls.update();
  else updateWalk(dt);
  composer.render();
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
